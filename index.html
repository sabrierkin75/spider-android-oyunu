<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>SpiderAndroid</title>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }
    </style>
</head>
<body>

    <!-- Oyun Ekranı -->
    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Sabit Oyun Çözünürlüğü (Dikey Mod)
        canvas.width = 1080;
        canvas.height = 1920;

        // Görsel Varlıkların Yüklenmesi
        const bg = new Image();
        bg.src = 'anims/bg_v.png'; // Gönderdiğiniz dikey arka plan görseli

        const eye = new Image();
        eye.src = 'eye.png';

        // Görseller yüklendiğinde döngüyü başlat
        let imagesLoaded = 0;
        const totalImages = 2;

        function imageLoaded() {
            imagesLoaded++;
            if (imagesLoaded === totalImages) {
                gameLoop();
            }
        }

        bg.onload = imageLoaded;
        eye.onload = imageLoaded;

        // Uygulama Mantığı ve Çizim Döngüsü
        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Arka Plan Çizimi
            ctx.drawImage(bg, 0, 0, canvas.width, canvas.height);
            
            // Göz Çizimi (Örnek merkez konumu)
            ctx.drawImage(eye, (canvas.width / 2) - (eye.width / 2), (canvas.height / 2) - (eye.height / 2));
        }

        function update() {
            // main.py içerisindeki spider/animasyon mantığı buraya eklenecektir
        }

        function gameLoop() {
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
    </script>
</body>
</html>
