<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Spider Android HTML5 Edition</title>
    <style>
        body, html { margin: 0; padding: 0; overflow: hidden; background: #1f1f1f; width: 100%; height: 100%; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui-panel { position: absolute; top: 10px; left: 10px; z-index: 10; display: flex; flex-direction: column; gap: 5px; }
        button { background: #27c15b; color: white; border: none; padding: 8px 15px; border-radius: 5px; font-weight: bold; cursor: pointer; }
        button.stop { background: #ed4242; }
    </style>
</head>
<body>

    <div id="ui-panel">
        <button id="toggle-btn" onclick="toggleSpiders()">Hareketi Durdur</button>
    </div>

    <canvas id="gameCanvas"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Ekran boyutlarını ayarla
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let spiderActive = true;
        let spiders = [];
        const maxSpiders = 6;
        const creatureSize = 80;
        const moveSpeed = 3;

        // Yaratık (Spider) Sınıfı
        class Spider {
            constructor() {
                this.size = creatureSize;
                // Ekran kenarlarından rastgele spawn olma
                const edge = Math.floor(Math.random() * 4);
                if (edge === 0) { this.x = -this.size; this.y = Math.random() * canvas.height; }
                else if (edge === 1) { this.x = canvas.width; this.y = Math.random() * canvas.height; }
                else if (edge === 2) { this.x = Math.random() * canvas.width; this.y = -this.size; }
                else { this.x = Math.random() * canvas.width; this.y = canvas.height; }

                this.angle = Math.random() * Math.PI * 2;
                this.isGrabbed = false;
            }

            update() {
                if (this.isGrabbed || !spiderActive) return;

                // İleri hareket vektörleri
                this.x += Math.cos(this.angle) * moveSpeed;
                this.y += Math.sin(this.angle) * moveSpeed;

                // Ekran dışına çıkma kontrolü (Sizin Python kodundaki mantık)
                if (this.x < -100 || this.x > canvas.width + 100 || this.y < -100 || this.y > canvas.height + 100) {
                    this.x = canvas.width / 2;
                    this.y = canvas.height / 2;
                    this.angle = Math.random() * Math.PI * 2;
                }
            }

            draw() {
                ctx.save();
                ctx.translate(this.x + this.size / 2, this.y + this.size / 2);
                ctx.rotate(this.angle);

                // Kivy görseli yerine HTML5 Canvas çizimi (Örnek böcek formu)
                ctx.fillStyle = "#e0a040";
                ctx.beginPath();
                ctx.arc(0, 0, this.size / 3, 0, Math.PI * 2); // Gövde
                ctx.fill();

                // Gözler
                ctx.fillStyle = "white";
                ctx.beginPath(); ctx.arc(10, -5, 4, 0, Math.PI * 2); ctx.arc(10, 5, 4, 0, Math.PI * 2);
                ctx.fill();

                ctx.restore();
            }
        }

        // Başlangıçta yaratıkları oluştur
        for (let i = 0; i < maxSpiders; i++) {
            spiders.push(new Spider());
        }

        // Dokunma / Mouse Kontrolleri (Sürükleyip Bırakma Mekaniği)
        let activeSpider = null;

        canvas.addEventListener('mousedown', e => touchStart(e.clientX, e.clientY));
        canvas.addEventListener('mousemove', e => touchMove(e.clientX, e.clientY));
        canvas.addEventListener('mouseup', () => touchEnd());

        canvas.addEventListener('touchstart', e => {
            const touch = e.touches[0];
            touchStart(touch.clientX, touch.clientY);
        });
        canvas.addEventListener('touchmove', e => {
            const touch = e.touches[0];
            touchMove(touch.clientX, touch.clientY);
        });
        canvas.addEventListener('touchend', () => touchEnd());

        function touchStart(x, y) {
            spiders.forEach(spider => {
                if (x >= spider.x && x <= spider.x + spider.size && y >= spider.y && y <= spider.y + spider.size) {
                    spider.isGrabbed = true;
                    activeSpider = spider;
                }
            });
        }

        function touchMove(x, y) {
            if (activeSpider) {
                activeSpider.x = x - activeSpider.size / 2;
                activeSpider.y = y - activeSpider.size / 2;
            }
        }

        function touchEnd() {
            if (activeSpider) {
                activeSpider.isGrabbed = false;
                activeSpider.angle = Math.random() * Math.PI * 2; // Bırakınca yeni yöne gitsin
                activeSpider = null;
            }
        }

        function toggleSpiders() {
            spiderActive = !spiderActive;
            const btn = document.getElementById('toggle-btn');
            if (spiderActive) {
                btn.textContent = "Hareketi Durdur";
                btn.classList.remove('stop');
            } else {
                btn.textContent = "Hareketi Başlat";
                btn.classList.add('stop');
            }
        }

        // Ana Oyun Döngüsü (Kivy içindeki Clock.schedule_interval karşılığı)
        function gameLoop() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            spiders.forEach(spider => {
                spider.update();
                spider.draw();
            });

            requestAnimationFrame(gameLoop);
        }

        gameLoop();
    </script>
</body>
</html>
