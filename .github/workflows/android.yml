name: Kivy Android APK Paketleyici

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Hatalı olan python-version düzeltildi

    - name: Sistem Bağımlılıklarını Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev install-info
        sudo apt-get install -y git zip unzip colordiff ccache
        sudo apt-get install -y python3-pip python3-setuptools python3-dev
        sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
        sudo apt-get install -y libgpgme11-dev libgpgme-dev libassuan-dev libb64-dev
               
    - name: Java JDK 17 Kurulumu
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Buildozer Kurulumu ve APK Derleme
      run: |
        # 1. Pip ve Buildozer'ın en güncel sürümünü yükleyin
        pip install --upgrade pip
        pip install --upgrade buildozer cython

        # 2. Buildozer'ın yüklendiği konumu sistem PATH değişkenine zorunlu olarak ekleyin
        export PATH=$PATH:~/.local/bin

        # 3. Önceki kalıntıları temizleyin
        buildozer android clean

        # 4. Detaylı log açık şekilde derlemeyi başlatın
        buildozer -v android debug
        
    - name: Hazır APK Dosyasını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Spider_Android_Uygulamasi
        path: bin/*.apk
