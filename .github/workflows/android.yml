name: Kivy Android APK Paketleyici

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Hatalı olan python-size düzeltildi

    - name: Sistem Bağımlılıklarını Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential libffi-dev install-info
        sudo apt-get install -y git zip unzip colordiff ccache
        sudo apt-get install -y python3-pip python3-setuptools python3-dev
        sudo apt-get install -y libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev
        sudo apt-get install -y libgpgme11-dev libgpgme-dev libassuan-dev libb64-dev
        pip3 install --upgrade pip
        pip3 install "cython<3.0.0" virtualenv jinja2 kivy
    - name: Java JDK 17 Kurulumu
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Hard Purge and Clean Build with Buildozer
      run: |
        # 1. Buildozer ve gerekli bağımlılıkları kuralım
        pip install --user --upgrade buildozer setuptools cython

        # 2. Hatalı bağları koparmak için .buildozer ve altındaki tüm gizli yapıları tamamen silelim
        rm -rf .buildozer/
        rm -rf ~/.buildozer/
        rm -rf ~/.gradle/

        # 3. KRİTİK SIRALAMA: Önce platform dizinlerini ayağa kaldırması için 'build' tetikliyoruz,
        # ardından detaylı log ile hata vermesini engelleyerek debug APK'sını üretiyoruz.
        ~/.local/bin/buildozer -v android debug

    - name: Hazır APK Dosyasını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Spider_Android_Uygulamasi
        path: bin/*.apk
