name: Build Kivy APK for Android 14+

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          openjdk-17-jdk \
          unzip \
          zip \
          zlib1g-dev \
          autoconf \
          automake \
          libtool \
          aidl

    - name: Install Buildozer and Dependencies
      run: |
        pip install --upgrade pip
        pip install "Cython<3.0.0" buildozer

    - name: Clean Buildozer Cache Environment
      run: |
        # Önceki hatalı denemelerden kalan yapay klasörleri tamamen temizliyoruz.
        # Böylece Buildozer temiz bir kurulum yapması gerektiğini anlayacak.
        rm -rf ~/.buildozer

    - name: Build APK with Buildozer
      run: |
        export BUILDOZER_ALLOW_KIVY_ANDROID_NEW_PERMISSIONS=1
        
        # 'yes' komutu yerine Linux 'stdbuf' kullanarak arabelleğe almayı (buffering) kapatıyoruz.
        # Bu sayede 'sdkmanager' aracı sorunsuz inecek ve 'Broken pipe' hatası tetiklenmeden lisanslar geçilecek.
        stdbuf -oL yes | buildozer android debug
      env:
        ACCEPT_SDK_LICENSE_AGREEMENT: "y"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
