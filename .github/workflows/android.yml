name: Kivy Android APK Paketleyici

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Java 17 Ortamını Kur
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Derleme Bağımlılıklarını Yükle
      run: |
        sudo apt-get update
        sudo apt-get install -y libsqlite3-dev lldd libffi-dev libssl-dev

    - name: Buildozer ile APK Üret (Temiz ve İzole)
      uses: ArtemGovorov/buildozer-action@v1
      with:
        command: buildozer -v android debug
