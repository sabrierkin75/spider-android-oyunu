name: Kivy Android APK Paketleyici

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Derleme için kararlı Java JDK 17 ortamını hazırlıyoruz
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    # Android SDK/NDK ve derleme araçları için gereken tüm sistem paketleri
    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake autopoint gettext
        pip3 install --user --upgrade "buildozer>=1.5.0" Cython==0.29.36 virtualenv

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Build APK with Buildozer
      run: |
        # Buildozer'ın komut satırı üzerinden lisansları otomatik onaylaması için auto_accept parametresini geçiyoruz
        buildozer android debug --auto-accept-licenses
      env:
        BUILDOZER_ALLOW_KIVY_NEW_DESIGNER: 1
