name: Kivy Android APK Paketleyici

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
 
    - name: Java JDK 17 Kurulumu
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Gerekli Linux Bağımlılıklarını Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          build-essential \
          ccache \
          git \
          libncurses5 \
          libssl-dev \
          unzip \
          zip \
          zlib1g-dev \
          autoconf \
          automake \
          libtool \
          pkg-config

    - name: Buildozer ve Cython Kurulumu (Resmi Paketler)
      run: |
        pip install --upgrade pip setuptools wheel
        pip install "cython<3.0.0"
        pip install buildozer

    - name: Build with Buildozer
      env:
        APP_CFLAGS: "-Wno-error=cast-function-type-strict"
      run: |
        python -m buildozer android debug

    - name: Hazır APK Dosyasını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Spider_Android_Uygulamasi
        path: bin/*.apk
        
