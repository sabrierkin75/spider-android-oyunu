name: Build Kivy APK for Android 14+

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          openjdk-17-jdk \
          unzip \
          zip \
          zlib1g-dev \
          autoconf \
          automake \
          libtool \
          aidl

    - name: Install Buildozer and Dependencies
      run: |
        pip install --upgrade pip
        # Bu hata spesifik olarak Cython ve Buildozer'ın belirli alt versiyonlarında pip çakışması yaratır.
        pip install "Cython<3.0.0" buildozer

    - name: Set up Android SDK Environment Variables
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg

    - name: Build APK with Buildozer (Fix Pip ImportError)
      run: |
        export BUILDOZER_ALLOW_KIVY_ANDROID_NEW_PERMISSIONS=1
        
        # --- HATAYI ÇÖZEN KRİTİK AYARLAR ---
        # python-for-android'in sanal ortam içinde pip'i yükseltip çökmesini engelliyoruz.
        export P4A_pip_upgrade=0
        export PIP_DISABLE_PIP_VERSION_CHECK=1
        
        # Linux arabelleğe alma mekanizmasını temizleyerek kararlı şekilde derlemeyi başlatıyoruz.
        stdbuf -oL yes | buildozer android debug
      env:
        ACCEPT_SDK_LICENSE_AGREEMENT: "y"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
