name: Kivy Android APK Paketleyici

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Fix ownership
      run: chown -R $(id -u):$(id -g) $GITHUB_WORKSPACE

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Build APK with Buildozer
      run: |
        # --auto-accept-licenses ile lisansları, spec dosyasındaki ayarla da root kontrolünü geçiyoruz
        buildozer -v android debug
      env:
        BUILDOZER_ALLOW_KIVY_NEW_DESIGNER: 1
        # Konteyner içi ek root korumalarını pasifize eden çevre değişkenleri
        BUILDOZER_WARN_ON_ROOT: 0
