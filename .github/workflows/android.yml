name: Build Kivy APK for Android 14+

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch: # Manuel tetikleme butonu ekler

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-cache-dependency-path: 'buildozer.spec'
        python-version: '3.11'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          openjdk-17-jdk \
          unzip \
          zip \
          zlib1g-dev \
          aidl # Sistem paketini de her ihtimale karşı kuruyoruz

    - name: Install Buildozer and Dependencies
      run: |
        pip install --upgrade pip
        pip install Cython==3.0.10 buildozer

    - name: Build APK with Buildozer (Auto Accept Licenses)
      run: |
        # yes | komutu otomatik olarak tüm Android SDK lisans sorularına 'y' (evet) yanıtını verir
        yes | buildozer android debug
      env:
        ACCEPT_SDK_LICENSE_AGREEMENT: "y"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spider-android-apk
        path: bin/*.apk
