name: Build Kivy APK for Android 14+

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          openjdk-17-jdk \
          unzip \
          zip \
          zlib1g-dev \
          autoconf \
          automake \
          libtool \
          aidl

    - name: Install Buildozer and Dependencies
      run: |
        pip install --upgrade pip
        pip install "Cython<3.0.0" buildozer

    - name: Set up Android SDK Environment Variables
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg

    - name: Build APK with Buildozer
      run: |
        # Döngüyü kaldırıp sadece ilk kurulum sorularını otomatik geçecek güvenli yapıyı kuruyoruz
        export BUILDOZER_ALLOW_KIVY_ANDROID_NEW_PERMISSIONS=1
        buildozer android debug
      env:
        ACCEPT_SDK_LICENSE_AGREEMENT: "y"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
        NDK_CCACHE: 1

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spider-android-apk
        path: bin/*.apk
