name: Kivy Android APK Paketleyici

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Hatalı olan python-version düzeltildi
 
    - name: Java JDK 17 Kurulumu
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Buildozer Kurulumu ve APK Derleme
      run: |
        # 1. Gerekli tüm sistem kütüphanelerini eksiksiz kurun (32-bit desteği dahil edildi)
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git libffi-dev libssl-dev lld bzip2 libgmp3-dev libmpfr-dev libmpc-dev lib32stdc++6 lib32z1

        # 2. Pip ve Python bağımlılıklarını güncelleyin
        pip install --upgrade pip
        pip install --upgrade buildozer cython toml sh virtualenv

        # 3. PATH ayarını tanımlayın
        export PATH=$PATH:~/.local/bin

        # 4. Hata veren clean komutları yerine önbelleği doğrudan Linux ile temizleyin
        rm -rf .buildozer/
        rm -f buildozer.spec.bak

        # 5. Derlemeyi detaylı log ile başlatın
        buildozer -v android debug
        
    - name: Hazır APK Dosyasını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Spider_Android_Uygulamasi
        path: bin/*.apk
