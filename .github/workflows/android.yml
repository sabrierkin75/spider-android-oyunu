name: Kivy Android APK Paketleyici

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Hatalı olan python-size düzeltildi

    - name: Sistem Bağımlılıklarını Kur
      env:
        PIP_CONSTRAINT: ""
        PIP_BREAK_SYSTEM_PACKAGES: "1"
      run: |
        python3 -m pip cache purge
        python3 -m pip install --upgrade pip setuptools wheel
        python3 -m pip install "Cython<3.0.0"
        python3 -m pip install --upgrade buildozer python-for-android

    - name: Java JDK 11 Kurulumu
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Clean Buildozer Cache
      run: |
        # Önceki hatalı nesne (object) dosyası artıklarını tamamen uçuruyoruz
        rm -rf .buildozer/
        # Temiz indirmeyle süreci başlatıyoruz
        buildozer android debug

    - name: Hazır APK Dosyasını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Spider_Android_Uygulamasi
        path: bin/*.apk
