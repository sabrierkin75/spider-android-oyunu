name: Build Kivy APK for Android 14+

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          openjdk-17-jdk \
          unzip \
          zip \
          zlib1g-dev \
          autoconf \
          automake \
          libtool \
          aidl

    - name: Install Buildozer and Dependencies
      run: |
        pip install --upgrade pip
        pip install "Cython<3.0.0" buildozer

    - name: Configure Linux Auto-Accept for Android SDK
      run: |
        # repositories.cfg dosyasını hazır hale getiriyoruz
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg

    - name: Build APK with Buildozer
      run: |
        # 'yes' komutunun Linux kanalını tıkamasını önlemek için döngülü hafif bir echo mimarisi kullanıyoruz.
        # Bu sayede hem 'sdkmanager bulunamadı' hatası vermez hem de 'Broken pipe' olmadan tüm lisansları otomatik geçer.
        (while true; do echo "y"; sleep 1; done) | buildozer android debug
      env:
        ACCEPT_SDK_LICENSE_AGREEMENT: "y"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spider-android-apk
        path: bin/*.apk
