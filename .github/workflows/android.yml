name: Kivy Android APK Paketleyici

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Hatalı olan python-version düzeltildi
 
    - name: Java JDK 17 Kurulumu
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Buildozer Kurulumu ve APK Derleme
      run: |
        pip install --upgrade pip
        pip install git+https://github.com
        pip install git+https://github.com
        env:
           APP_CFLAGS: "-Wno-error=cast-function-type-strict"
     - name: Build with Buildozer
       run: |
           buildozer android clean
           buildozer android debug

    - name: Hazır APK Dosyasını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Spider_Android_Uygulamasi
        path: bin/*.apk
