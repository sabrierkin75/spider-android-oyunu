name: Buildozer APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Buildozer and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev liblzma-dev lzma ant
        python -m pip install --upgrade pip==24.0
        pip install "buildozer>=1.5.0" "cython<3.0.0" setuptools sh
        pip install kivy

    - name: Generate Buildozer Spec
      run: |
        buildozer init
        # Spec dosyasını Android 14 (API 34) için kararlı yapıda oluştur
        sed -i 's/^title = My Application/title = Spider Android/g' buildozer.spec
        sed -i 's/^package.name = myapp/package.name = spiderandroid/g' buildozer.spec
        sed -i 's/^package.domain = org.test/package.domain = org.sabrierkin/g' buildozer.spec
        sed -i 's/^source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,json/g' buildozer.spec
        sed -i 's/^requirements = python3,kivy/requirements = python3,kivy,pyjnius/g' buildozer.spec
        sed -i 's/^#android.archs = armeabi-v7a, arm64-v8a/android.archs = arm64-v8a/g' buildozer.spec
        sed -i 's/^#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
        
        # Sadece Android 14 Hedefi (Geriye dönük uyumlulukla Android 16 telefonunuzda çalışır)
        sed -i 's/^#android.api = 31/android.api = 34/g' buildozer.spec
        sed -i 's/^#android.minapi = 21/android.minapi = 34/g' buildozer.spec

    - name: Build APK with Buildozer
      run: |
        # Hata veren clean komutunu kaldırıp doğrudan ilk kuruluma geçiyoruz
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Spider-Android-APK
        path: bin/*.apk
