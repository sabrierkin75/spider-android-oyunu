name: Kivy Android APK Paketleyici

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Hatalı olan python-size düzeltildi

    - name: Sistem Bağımlılıklarını Kur
      run: |
        pip install --upgrade pip
        pip install Cython==0.29.36
        pip install git+https://github.com
        pip install git+https://github.com

    - name: Java JDK 11 Kurulumu
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'
        
    - name: Clean Buildozer Cache
      run: buildozer android clean

    - name: Buildozer Kurulumu ve APK Derleme
      run: |
        pip3 install --user --upgrade "buildozer==1.5.0" # Kararlı sürüm kilitlendi
        export PATH=$PATH:~/.local/bin
        buildozer -v android debug

    - name: Hazır APK Dosyasını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Spider_Android_Uygulamasi
        path: bin/*.apk
