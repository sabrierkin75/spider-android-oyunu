name: Buildozer APK Derleyici

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Kodu Klonla
      uses: actions/checkout@v4

    - name: Java Kurulumu (JDK 17)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Sistem Paketlerini Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev

    - name: Buildozer ve Bağımlılıkları Yükle
      run: |
        pip3 install --user --upgrade buildozer Cython==0.29.36 virtualenv

    - name: Android Komut Satırı Araçlarını Kur (sdkmanager Dizin Çözümü)
      run: |
        # Buildozer'ın hata verdiği dizin yapısını oluşturuyoruz
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        
        # Resmi Google Android komut satırı araçlarını indiriyoruz
        curl -sL https://google.com -o cmdline-tools.zip
        unzip -q cmdline-tools.zip -d ~/.buildozer/android/platform/android-sdk/cmdline-tools
        rm cmdline-tools.zip
        
        # İçeriği 'latest' klasörüne taşıyarak standartlaştırıyoruz
        mv ~/.buildozer/android/platform/android-sdk/cmdline-tools/cmdline-tools ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest
        
        # EN KRİTİK ADIM: Buildozer'ın aradığı eski yola, yeni sdkmanager'ın kısayolunu bağlıyoruz
        ln -s ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        ln -s ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/avdmanager ~/.buildozer/android/platform/android-sdk/tools/bin/avdmanager
        
        # Lisansları otomatik olarak kabul ediyoruz
        yes | ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

    - name: APK Derleme İşlemini Başlat
      run: |
        export PATH=$PATH:~/.local/bin
        # Artık sdkmanager ve aidl yerinde hazır olduğu için Buildozer doğrudan paketlemeye geçecek
        yes | buildozer android debug

    - name: Hazır APK Dosyasını Yükle
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Spider-Android-Debug-APK
        path: bin/*.apk
