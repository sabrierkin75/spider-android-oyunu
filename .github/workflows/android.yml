name: Kivy Android APK Paketleyici

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
      # 1. Java Ortamını Kurun (Buildozer için şarttır)
     - name: Set up JDK 17
       uses: actions/setup-java@v4
       with:
          distribution: 'temurin'
          java-version: '17'

      # 2. Android SDK Lisanslarını Otomatik Kabul Edin
      - name: Accept Android SDK Licenses
        run: |
          mkdir -p ${{ gitea.workspace || github.workspace }}/.android
          touch ~/.android/repositories.cfg
          yes | sdkmanager --licenses || true

      # 3. Gerekli Bağımlılıkları ve Aidl Paketini Yükleyin
      - name: Install Dependencies and Aidl
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip build-essential git libltdl-dev libffi-dev libssl-dev cmake
          # Android build-tools paketini manuel olarak sisteme çağırın
          yes | sdkmanager "build-tools;34.0.0" "platform-tools" "platforms;android-34"

      # 4. Buildozer ile APK Derleme Adımı (Lisansları onaylayarak başlatın)
      - name: Build with Buildozer
        run: |
          pip install --user buildozer
          # İlk olarak lisansları buildozer üzerinden de kabul ettirin
          buildozer android licenses accept
          # Ardından derleme işlemini başlatın
          buildozer -v android debug
