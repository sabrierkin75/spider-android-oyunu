name: Build Kivy APK for Android 14+

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          openjdk-17-jdk \
          unzip \
          zip \
          zlib1g-dev \
          autoconf \
          automake \
          libtool

    - name: Install Buildozer and Dependencies
      run: |
        pip install --upgrade pip
        pip install "Cython<3.0.0" buildozer

    - name: Build APK using GitHub Pre-installed Android SDK (Bypass All Downloads)
      run: |
        # 1. Buildozer'ın kendi klasör yapısını taklit ederek sistemdeki hazır SDK/NDK'ya köprü kuruyoruz
        mkdir -p ~/.buildozer/android/platform
        
        # GitHub'da hazır kurulu gelen resmi Android SDK ve NDK r25b-r26b yapılarını Buildozer klasörüne bağlıyoruz
        ln -s $ANDROID_HOME ~/.buildozer/android/platform/android-sdk
        ln -s $ANDROID_NDK_LATEST_HOME ~/.buildozer/android/platform/android-ndk-r26b
        
        # 2. Buildozer'a internetten yeni bir şey indirmemesini, sistemdekileri kullanmasını emrediyoruz
        export BUILDOZER_ALLOW_KIVY_ANDROID_NEW_PERMISSIONS=1
        export P4A_pip_upgrade=0
        export PIP_DISABLE_PIP_VERSION_CHECK=1
        
        # 3. Lisansları onaylanmış kabul ettiriyoruz
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n89334d701ee692324b1b1c8e1d326f0d4d27d4fa" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        
        # Artık 'yes' döngüsüne gerek yok, her şey yerel diskten okunacak
        buildozer android debug
      env:
        ACCEPT_SDK_LICENSE_AGREEMENT: "y"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
        NDK_CCACHE: 1

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spider-android-apk
        path: bin/*.apk
