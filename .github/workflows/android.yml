name: Kivy Android APK Paketleyici

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt update
        sudo apt install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev automake autopoint gettext
        pip3 install --user --upgrade buildozer Cython==0.29.36 virtualenv

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    # Android SDK'nın aidl aracını Buildozer'ın aradığı eski konuma manuel olarak linkliyoruz
    - name: Fix Android SDK AIDL Path
      run: |
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0/
        # Eğer Buildozer SDK'yı henüz indirmediyse klasör yapısını hazırlarız, indirdiğinde aidl sorunsuz eşleşir.
        ln -sf ~/.buildozer/android/platform/android-sdk/build-tools/*/aidl ~/.buildozer/android/platform/android-sdk/build-tools/33.0.0/aidl || true

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug
      env:
        BUILDOZER_ALLOW_KIVY_NEW_DESIGNER: 1

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spider-android-apk
        path: bin/*.apk
        retention-days: 7
