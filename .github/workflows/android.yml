name: Kivy APK Derleyici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Sistem Paketlerini Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev wget curl xz-utils tk-dev libxml2-dev libxslt1-dev
        sudo apt-get install -y openjdk-17-jdk unzip zip
        sudo apt-get install -y autoconf automake libtool pkg-config cmake

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Buildozer ve Bağımlılıkları Yükle
      run: |
        python -m pip install --upgrade pip
        pip install cython
        # Hatayı önlemek için tam ve kararlı sürüm adresi tanımlandı
        pip install buildozer

    - name: APK Dosyasını Derle
      run: |
        buildozer android debug
      env:
        ACCEPT_ANDROID_SDK_LICENSES: 'y'

    - name: APK Dosyasını Çıktı Olarak Paylaş
      uses: actions/upload-artifact@v4
      with:
        name: Spider-Android-APK
        path: bin/*.apk
