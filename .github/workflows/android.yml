yaml
name: Buildozer APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Buildozer and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev liblzma-dev lzma ant
        python -m pip install --upgrade pip==24.0
        # Python 3.14'e kaçmayı önlemek için p4a ve buildozer'ı kararlı sürümlerine sabitliyoruz
        pip install "buildozer==1.5.0" "cython<3.0.0" setuptools sh "python-for-android==2024.1.21"
        pip install kivy

    - name: Force Kararli Buildozer Spec
      run: |
        rm -f buildozer.spec
        
        cat << 'EOF' > buildozer.spec
        [app]
        title = Spider Android
        package.name = spiderandroid
        package.domain = org.sabrierkin
        source.dir = .
        source.include_exts = py,png,jpg,kv,atlas,json
        version = 1.4.0
        
        # Çökmeye sebep olan '==' ifadesini tamamen kaldırıp p4a kararlı sürümüne emanet ediyoruz
        requirements = python3,kivy,pyjnius
        
        orientation = portrait
        osx.kivy_version = 2.3.0
        fullscreen = 1
        
        # Android Yapılandırması (Android 14 Hedefi)
        android.api = 34
        android.minapi = 34
        android.ndk_api = 24
        android.archs = arm64-v8a
        android.accept_sdk_license = True
        android.skip_apk_rescale = True
        
        # Bağımlılık Çözümleri
        android.gradle_dependencies = 'org.libsdl:SDL2_mixer:2.6.3'
        
        [buildozer]
        log_level = 2
        warn_on_root = 1
        EOF

    - name: Build APK with Buildozer
      run: |
        rm -rf .buildozer/
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Spider-Android-APK
        path: bin/*.apk
