name: Build Kivy APK for Android 14+

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          openjdk-17-jdk \
          unzip \
          zip \
          zlib1g-dev \
          autoconf \
          automake \
          libtool

    - name: Install Buildozer and Dependencies
      run: |
        pip install --upgrade pip
        pip install "Cython<3.0.0" buildozer

    - name: Fix Android SDK Layout for Buildozer (Bypass Sdkmanager & Aidl Error)
      run: |
        # 1. Temel Buildozer platform dizinini oluşturuyoruz
        mkdir -p ~/.buildozer/android/platform/android-sdk
        
        # 2. Sistemde kurulu olan resmi Android SDK klasörünün içeriğini Buildozer'a köprülüyoruz
        ln -s $ANDROID_HOME/* ~/.buildozer/android/platform/android-sdk/ 2>/dev/null || true
        
        # 3. CRITICAL FIX: Buildozer'ın aradığı eski 'tools/bin' yolunu oluşturup 
        # sistemdeki modern 'cmdline-tools' içindeki sdkmanager'ı buraya bağlıyoruz.
        mkdir -p ~/.buildozer/android/platform/android-sdk/tools/bin
        ln -s /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager ~/.buildozer/android/platform/android-sdk/tools/bin/sdkmanager
        
        # 4. Sistemdeki en güncel NDK sürümünü (r26b/r27) Buildozer'ın arayacağı yola bağlıyoruz
        ln -s $ANDROID_NDK_LATEST_HOME ~/.buildozer/android/platform/android-ndk-r26b 2>/dev/null || true
        
        # 5. Tüm lisansları önceden onaylıyoruz
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses
        echo -e "\n89334d701ee692324b1b1c8e1d326f0d4d27d4fa" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-preview-license

    - name: Build APK with Buildozer
      run: |
        export BUILDOZER_ALLOW_KIVY_ANDROID_NEW_PERMISSIONS=1
        export P4A_pip_upgrade=0
        export PIP_DISABLE_PIP_VERSION_CHECK=1
        
        # Çakışmaları önlemek için sistem çevre değişkenlerini Buildozer'a göre temizliyoruz
        unset ANDROID_NDK
        unset ANDROID_NDK_HOME
        unset ANDROID_NDK_ROOT
        unset ANDROID_NDK_LATEST_HOME
        
        # Artık internet indirmesi ve yes döngüsü yok, doğrudan yerel derleme başlıyor
        buildozer android debug
      env:
        ACCEPT_SDK_LICENSE_AGREEMENT: "y"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
        NDK_CCACHE: 1

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spider-android-apk
        path: bin/*.apk
