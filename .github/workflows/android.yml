name: Buildozer APK Derleyici

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Kodu Klonla
      uses: actions/checkout@v4

    - name: Java Kurulumu (JDK 17)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Python 3.11 Kur (Uyuşmazlık Çözümü)
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Sistem Paketlerini Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev wget

    - name: Derleme Motoru Sürümlerini Kilitle
      run: |
        python3 -m pip install --upgrade pip
        # 3.14 dayatmasını yapan güncel motor yerine kararlı eski yapıyı kilitliyoruz
        python3 -m pip install "buildozer==1.5.0" "Cython<3.0.0" virtualenv wheel sh
        python3 -m pip install "python-for-android==2024.1.21"

    - name: APK Derleme İşlemini Başlat
      run: |
        export PATH=$PATH:~/.local/bin
        # Derleme motorunu 1.5.0'a çektiğimiz için artık 3.14.2'yi aramayı bırakıp kararlı paketleri basacaktır
        yes | buildozer android debug

    - name: Hazır APK Dosyasını Yükle
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Spider-Android-Debug-APK
        path: bin/*.apk
