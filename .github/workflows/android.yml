name: Buildozer APK Derleyici

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Kodu Klonla
      uses: actions/checkout@v4

    - name: Buildozer ile APK Derle
      uses: ArtemSg/buildozer-action@v1
      with:
        command: buildozer android debug
        repository_root: .

    - name: Hazır APK Dosyasını Yükle
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Spider-Android-Debug-APK
        path: bin/*.apk
