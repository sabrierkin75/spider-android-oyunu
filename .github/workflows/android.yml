name: Build Kivy APK for Android 14+

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          openjdk-17-jdk \
          unzip \
          zip \
          zlib1g-dev \
          autoconf \
          automake \
          libtool \
          aidl

    - name: Install Buildozer and Dependencies
      run: |
        pip install --upgrade pip
        pip install "Cython<3.0.0" buildozer

    - name: Pre-install Android SDK Build Tools & Accept Licenses
      run: |
        # 1. Buildozer'ın oluşturacağı temel SDK dizin yapısını hazırlıyoruz
        mkdir -p ~/.buildozer/android/platform/android-sdk/cmdline-tools/latest/bin
        mkdir -p ~/.buildozer/android/platform/android-sdk/licenses

        # 2. Ubuntu üzerinde hazır bulunan resmi Android SDK araçlarını kullanarak lisansları önceden onaylıyoruz
        sudo cmdline-tools-mgmt accept-licenses 2>/dev/null || true
        
        # 3. Buildozer'ın aradığı tüm resmi Google ve Android lisans anahtarlarını doğrudan dosyaya yazıyoruz
        echo -e "\n89334d701ee692324b1b1c8e1d326f0d4d27d4fa\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n84831b9409646a918e30573bab4c9c91346d8abd" > ~/.buildozer/android/platform/android-sdk/licenses/android-sdk-license
        
        # 4. Eksik olan aidl hatasını tamamen bypass etmek için sistemdeki aidl aracını Buildozer klasörüne bağlıyoruz
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/34.0.0/
        cp /usr/bin/aidl ~/.buildozer/android/platform/android-sdk/build-tools/34.0.0/aidl
        chmod +x ~/.buildozer/android/platform/android-sdk/build-tools/34.0.0/aidl

    - name: Build APK with Buildozer
      run: |
        # Bu parametre Buildozer'a lisansların ve araçların hazır olduğunu bildirir
        export BUILDOZER_ALLOW_KIVY_ANDROID_NEW_PERMISSIONS=1
        buildozer android debug
      env:
        ACCEPT_SDK_LICENSE_AGREEMENT: "y"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spider-android-apk
        path: bin/*.apk
