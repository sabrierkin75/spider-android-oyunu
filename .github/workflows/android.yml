name: Buildozer APK Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Get Date
      id: get-date
      run: |
        echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

    - name: Cache Buildozer Global Directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: buildozer-global-${{ runner.os }}-${{ steps.get-date.outputs.date }}

    - name: Cache Buildozer Project Directory
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: buildozer-project-${{ runner.os }}-${{ steps.get-date.outputs.date }}

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Buildozer and Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev tk-dev libgdbm-compat-dev liblzma-dev lzma ant
        pip install --upgrade pip
        pip install buildozer cython setuptools sh
        pip install kivy

    - name: Generate Buildozer Spec
      run: |
        buildozer init
        # spec dosyasını hata vermeyecek şekilde en baştan optimize et
        sed -i 's/^title = My Application/title = Spider Android/g' buildozer.spec
        sed -i 's/^package.name = myapp/package.name = spiderandroid/g' buildozer.spec
        sed -i 's/^package.domain = org.test/package.domain = org.sabrierkin/g' buildozer.spec
        sed -i 's/^source.include_exts = py,png,jpg,kv,atlas/source.include_exts = py,png,jpg,kv,atlas,json/g' buildozer.spec
        sed -i 's/^requirements = python3,kivy/requirements = python3,kivy,pyjnius/g' buildozer.spec
        sed -i 's/^#android.archs = armeabi-v7a, arm64-v8a/android.archs = arm64-v8a/g' buildozer.spec
        sed -i 's/^#android.accept_sdk_license = False/android.accept_sdk_license = True/g' buildozer.spec
        # NDK uyarılarını ve Gradle uyumsuzluklarını önlemek için kararlı minimum API seviyelerini ayarla
        sed -i 's/^#android.api = 31/android.api = 33/g' buildozer.spec
        sed -i 's/^#android.minapi = 21/android.minapi = 21/g' buildozer.spec

    - name: Build APK with Buildozer
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Spider-Android-APK
        path: bin/*.apk
