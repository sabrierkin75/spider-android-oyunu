name: Build Kivy APK for Android 14+

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest # En güncel ve hızlı Action sunucusuna geçildi

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Build APK with Pre-built Buildozer Action
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        workdir: .
        buildozer_version: stable

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spider-android-apk
        path: ${{ steps.buildozer.outputs.filename }}
        
