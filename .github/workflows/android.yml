name: Kivy Android APK Paketleyici

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Ana makineyi kesin olarak Python 3.11'e sabitliyoruz
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libncursesw5-dev libffi-dev uuid-dev libffi7 openjdk-17-jdk signcreative zip unzip

      - name: Install Buildozer and Kivy
        run: |
          pip install --upgrade pip
          pip install Cython==3.0.11
          pip install buildozer kivy==2.3.0

      # Geçmişteki tüm hatalı 3.14 ve buildozer önbelleğini tamamen sıfırlıyoruz
      - name: Clear Buildozer Cache
        run: |
          rm -rf .buildozer/
          rm -rf ~/.buildozer/

      - name: Build APK with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spider-android-apk
          path: bin/*.apk
