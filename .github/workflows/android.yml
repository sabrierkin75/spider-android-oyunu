name: Kivy Android APK Paketleyici

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache Buildozer Global Dirs
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer
            .buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            ${{ runner.os }}-buildozer-

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libncursesw5-dev libffi-dev uuid-dev openjdk-17-jdk zip unzip

      - name: Install Python Tools
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install Cython==3.0.11 buildozer kivy==2.3.0

      - name: Build APK with Buildozer
        run: |
          export PATH=$PATH:/home/runner/.local/bin
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          python -m buildozer -v android debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: spider-android-apk
          path: bin/*.apk
