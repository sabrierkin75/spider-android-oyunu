name: Kivy Android APK Paketleyici

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libsqlite3-dev sqlite3 bzip2 libbz2-dev zlib1g-dev libssl-dev openssl libgdbm-dev libgdbm-compat-dev liblzma-dev libreadline-dev libncursesw5-dev libffi-dev uuid-dev openjdk-17-jdk zip unzip

      # Burası çok önemli: Eski araçların Python 3.14 çağırmasını engellemek için sürümleri sabitliyoruz
      - name: Install Buildozer and Dependencies
        run: |
          pip install --upgrade pip setuptools wheel
          pip install Cython==3.0.11
          pip install buildozer==1.5.0
          pip install kivy==2.3.0

      # Gizli kalmış tüm Android SDK/NDK ve python-for-android kalıntılarını kökten kazıyoruz
      - name: Deep Clean Buildozer
        run: |
          rm -rf .buildozer/
          rm -rf ~/.buildozer/
          rm -rf ~/.local/share/python-for-android/

      - name: Build APK with Buildozer
        run: |
          export PATH=$PATH:~/.local/bin
          unset ANDROID_NDK_HOME
          unset ANDROID_NDK_ROOT
          # buildozer'a temizlik komutu vererek başlıyoruz
          buildozer android clean
          buildozer -v android debug
