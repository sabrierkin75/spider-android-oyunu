name: Kivy Android APK Paketleyici

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # Aidl ve SDK yolları düzeltilmiş hazır Buildozer ortamını konteyner olarak çağırıyoruz
    container:
      image: subaltaic/buildozer:latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # GitHub Runner kullanıcısının izinlerini konteyner içiyle eşitler
    - name: Fix ownership
      run: chown -R $(id -u):$(id -g) $GITHUB_WORKSPACE

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Build APK with Buildozer
      run: |
        # Konteyner içindeki kararlı Buildozer motoru ile derleme başlatılır
        buildozer -v android debug

     Tarayıcıdan indirirken kolaylık olması için üretilen APK'yı GitHub Actions paneline yükler
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spider-android-apk
        path: bin/*.apk
        retention-days: 7
