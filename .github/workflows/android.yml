name: Kivy Android APK Paketleyici

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Buildozer ile APK Üret (İzole Docker Modu)
      uses: ArtemSBulgakov/buildozer-action@v1
      id: buildozer
      with:
        command: buildozer -v android debug
        buildozer_version: stable

    - name: APK Dosyasını Çıktı Olarak Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Spider-Android-APK
        path: ${{ steps.buildozer.outputs.filename }}
