name: Kivy APK Derleyici

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Sistem Paketlerini Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y build-essential ccache git zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev wget curl xz-utils tk-dev libxml2-dev libxslt1-dev
        sudo apt-get install -y openjdk-17-jdk unzip zip
        sudo apt-get install -y autoconf automake libtool pkg-config cmake
        # Sistem seviyesinde aidl kurulumunu garanti ediyoruz
        sudo apt-get install -y aidl

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Buildozer Kurulumu
      run: |
        python -m pip install --upgrade pip
        pip install cython
        pip install buildozer==1.5.0

    - name: Buildozer Aidl Dosya Yollarını Önceden Hazırla
      run: |
        # Buildozer'ın hata verdiği kök SDK klasör yapısını el ile oluşturuyoruz
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/build-tools/33.0.0
        mkdir -p /home/runner/.buildozer/android/platform/android-sdk/build-tools/34.0.0
        
        # Sistemdeki çalışan gerçek aidl derleyicisini bu hedef yollara sembolik bağ olarak yerleştiriyoruz
        ln -s /usr/bin/aidl /home/runner/.buildozer/android/platform/android-sdk/build-tools/33.0.0/aidl
        ln -s /usr/bin/aidl /home/runner/.buildozer/android/platform/android-sdk/build-tools/34.0.0/aidl
        
        # Ek olarak Buildozer'ın ortam değişkeni (environment) seviyesinde aidl'i doğrudan görmesini sağlıyoruz
        echo "PATH=$PATH:/usr/bin" >> $GITHUB_ENV

    - name: APK Dosyasını Derle
      run: |
        buildozer android debug
      env:
        ACCEPT_ANDROID_SDK_LICENSES: 'y'

    - name: APK Dosyasını Çıktı Olarak Paylaş
      uses: actions/upload-artifact@v4
      with:
        name: Spider-Android-APK
        path: bin/*.apk
