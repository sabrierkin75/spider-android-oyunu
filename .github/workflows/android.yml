name: Kivy Android APK Paketleyici

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # Hatalı olan :master etiketi resmi ve kararlı olan :latest ile değiştirildi
    container:
      image: ghcr.io/kivy/buildozer:latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # GitHub Actions kullanıcısının dosya izinlerini konteyner içiyle eşitler
    - name: Fix ownership
      run: chown -R $(id -u):$(id -g) $GITHUB_WORKSPACE

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Build APK with Buildozer
      run: |
        # Hazır resmi imaj ortamında doğrudan hatasız derleme başlatılır
        buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spider-android-apk
        path: bin/*.apk
        retention-days: 7
