name: Kivy Android APK Paketleyici

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Python Kurulumu
      uses: actions/setup-python@v5
      with:
        python-version: '3.10' # Hatalı olan python-version düzeltildi
 
    - name: Java JDK 17 Kurulumu
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Buildozer Kurulumu ve APK Derleme
      run: |
        # 1. Gerekli sistem paketlerini ve Python kütüphanelerini yükleyin
        sudo apt-get update
        sudo apt-get install -y libffi-dev gettext altinstall
        pip install --upgrade pip
        pip install --upgrade buildozer cython toml sh virtualenv

        # 2. PATH ayarını tanımlayın
        export PATH=$PATH:~/.local/bin

        # 3. Hata veren global temizlik yerine sadece yerel .buildozer klasörünü silin
        rm -rf .buildozer/
        rm -f buildozer.spec.bak

        # 4. Derlemeyi sıfırdan ve detaylı log ile başlatın
        buildozer -v android debug
        
    - name: Hazır APK Dosyasını Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Spider_Android_Uygulamasi
        path: bin/*.apk
