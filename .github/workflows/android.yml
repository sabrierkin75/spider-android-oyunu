name: Kivy Android APK Paketleyici

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Java 17 Kurulumu
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: İşletim Sistemi Bağımlılıklarını Yükle
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip zlib1g-dev \
          libssl-dev libffi-dev libsqlite3-dev build-essential \
          autoconf libtool pkg-config python3-pip python3-setuptools python3-dev

    - name: Buildozer Kurulumu
      run: |
        pip install --user --upgrade buildozer cython setuptools

    - name: APK Derleme (Sıfırdan Saf Çıktı)
      run: |
        rm -rf .buildozer/
        rm -rf bin/
        
        # --- GÜNCELLENEN ALAN: GRADLE VE ANDROID LİSANS İZOLASYONU ---
        # Android SDK lisanslarını otomatik olarak kabul etmeye zorlar
        mkdir -p ~/.android && touch ~/.android/repositories.cfg
        yes | sdkmanager --licenses || true
        
        # Buildozer'ın dışarıdaki Gradle yerine kendi izole Gradle motorunu sıfırdan kurmasını sağlar
        export GRADLE_OPTS="-Dorg.gradle.daemon=false -Dorg.gradle.jvmargs=-Xmx2048m"
        ~/.local/bin/buildozer -v android debug

    - name: Üretilen APK Dosyasını artifact Olarak Yükle
      uses: actions/upload-artifact@v4
      with:
        name: Hunter-Spider-Uygulaması
        path: bin/*.apk
