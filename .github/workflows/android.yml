name: Buildozer APK Derleyici

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Kodu Klonla
      uses: actions/checkout@v4

    - name: Java Kurulumu (JDK 17)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Sistem Paketlerini Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev

    - name: Buildozer ve Cython Yükle
      run: |
        # Kivy 2.3.0 ve Python 3.11 ile %100 uyumlu çalışan kararlı sürümleri kuruyoruz
        pip3 install --user --upgrade "buildozer<1.6.0" "Cython<3.0.0" virtualenv

    - name: APK Derleme İşlemini Başlat
      run: |
        export PATH=$PATH:~/.local/bin
        # Sürümler ve Buildozer motoru 1.5.0 standartlarına çekildiği için takılmadan saniyeler içinde derlenecektir
        yes | buildozer android debug
