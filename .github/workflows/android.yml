name: Buildozer APK Derleyici

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Kodu Klonla
      uses: actions/checkout@v4

    - name: Java Kurulumu (JDK 17)
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Sistem Paketlerini Kur
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libgdbm-dev libnss3-dev libssl-dev libreadline-dev libffi-dev libsqlite3-dev sqlite3 bzip2 libbz2-dev

    - name: Kararlı Derleme Paketlerini Kur
      run: |
        # Buildozer motorunu güncel tutuyoruz
        pip3 install --user --upgrade buildozer Cython virtualenv
        
        # Sürüm uyuşmazlığını (3.11 != 3.14) yaratan p4a paketini en kararlı Android sürümüne (2024.01.21) zorla kilitliyoruz
        pip3 install --user --upgrade "python-for-android==2024.1.21"

    - name: APK Derleme İşlemini Başlat
      run: |
        export PATH=$PATH:~/.local/bin
        # Artık hem bilgisayar hem cihaz sürümü kilitlendiği için hata vermeden doğrudan APK basılacaktır
        yes | buildozer android debug

    - name: Hazır APK Dosyasını Yükle
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Spider-Android-Debug-APK
        path: bin/*.apk
