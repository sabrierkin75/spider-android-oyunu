name: Build Kivy APK for Android 14+

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    # --- GİTHUB'IN İŞLEMİ YARIDA KESMESİNİ ÖNLEYEN KRİTİK SÜRE SINIRI (90 DAKİKA) ---
    timeout-minutes: 90 

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          openjdk-17-jdk \
          unzip \
          zip \
          zlib1g-dev \
          autoconf \
          automake \
          libtool \
          aidl

    - name: Install Buildozer and Cython
      run: |
        pip install --upgrade pip
        pip install "Cython<3.0.0" buildozer

    - name: Cache Buildozer Android Platform
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
        restore-keys: |
          ${{ runner.os }}-buildozer-

    - name: Pre-accept Android SDK Licenses
      run: |
        mkdir -p ~/.android
        touch ~/.android/repositories.cfg

    - name: Build APK with Buildozer (Force Active Stream)
      run: |
        export BUILDOZER_ALLOW_KIVY_ANDROID_NEW_PERMISSIONS=1
        export P4A_pip_upgrade=0
        export PIP_DISABLE_PIP_VERSION_CHECK=1
        
        unset ANDROID_NDK
        unset ANDROID_NDK_HOME
        unset ANDROID_NDK_ROOT
        unset ANDROID_NDK_LATEST_HOME
        
        # Saniyede bir arka planda tetikleme yaparak sunucuyu uyanık tutan hafif Linux motoru
        (while true; do echo "...derleme devam ediyor, lutfen sunucuyu kapatmayin..."; sleep 15; done) &
        
        # stdbuf -oL -eL komutları derleme esnasındaki tüm C çıktılarını anlık olarak terminale basmaya zorlar.
        # Bu sayede sunucu asla 'sessiz kaldı' uyarısıyla donamaz.
        stdbuf -oL -eL buildozer android debug
      env:
        ACCEPT_SDK_LICENSE_AGREEMENT: "y"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
        NDK_CCACHE: 1

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spider-android-apk
        path: "**/*.apk"
