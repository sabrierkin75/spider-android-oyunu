name: Build Kivy APK for Android 14+

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential \
          ccache \
          git \
          libffi-dev \
          libssl-dev \
          openjdk-17-jdk \
          unzip \
          zip \
          zlib1g-dev \
          autoconf \
          automake \
          libtool \
          aidl

    - name: Install Buildozer and Dependencies
      run: |
        pip install --upgrade pip
        pip install "Cython<3.0.0" buildozer

    - name: Inject System Aidl into Buildozer Paths (Bypass Aidl Error)
      run: |
        # Buildozer'ın ileride oluşturacağı tüm olası Android SDK build-tools yollarını şimdiden hazırlıyoruz
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/34.0.0/
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/35.0.0/
        mkdir -p ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0/
        
        # Ubuntu sistemindeki resmi aidl aracını bu klasörlerin tamamına şimdiden enjekte ediyoruz
        cp /usr/bin/aidl ~/.buildozer/android/platform/android-sdk/build-tools/34.0.0/aidl
        cp /usr/bin/aidl ~/.buildozer/android/platform/android-sdk/build-tools/35.0.0/aidl
        cp /usr/bin/aidl ~/.buildozer/android/platform/android-sdk/build-tools/37.0.0/aidl
        
        # Çalıştırılma yetkilerini veriyoruz
        chmod +x ~/.buildozer/android/platform/android-sdk/build-tools/*/aidl

    - name: Build APK with Buildozer
      run: |
        export BUILDOZER_ALLOW_KIVY_ANDROID_NEW_PERMISSIONS=1
        export P4A_pip_upgrade=0
        export PIP_DISABLE_PIP_VERSION_CHECK=1
        
        unset ANDROID_NDK
        unset ANDROID_NDK_HOME
        unset ANDROID_NDK_ROOT
        unset ANDROID_NDK_LATEST_HOME
        
        # Hem lisansları otomatik onaylıyoruz hem de veri akış kanalının kilitlenmesini önlüyoruz
        stdbuf -oL yes | buildozer android debug
      env:
        ACCEPT_SDK_LICENSE_AGREEMENT: "y"
        GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4g"
        NDK_CCACHE: 1

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: spider-android-apk
        path: bin/*.apk
